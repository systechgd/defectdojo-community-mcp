name: Feature request
description: Suggest a new tool or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **This server is read-only by design.** Proposals for tools that write to
        DefectDojo (create, update, delete, import) will be declined — see the
        Safety model in the README. Write support, if it ever exists, will be a
        separate server so operators can grant read without write.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the triage workflow, not just the API call you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed tool or change
    validations:
      required: true

  - type: checkboxes
    id: readonly
    attributes:
      label: Confirmation
      options:
        - label: This proposal is read-only (no POST, PUT, PATCH or DELETE).
          required: true
