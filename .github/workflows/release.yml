name: Release

# Publishes the package to PyPI and the image to GHCR.
#
# Triggered by pushing a v* tag. workflow_dispatch runs the container job only,
# so the image can be (re)published without minting a new version — the PyPI
# job is deliberately tag-only, because a release must correspond to a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref_name:
        description: "Tag to build from (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      publish_pypi:
        description: "Also publish that tag to PyPI (requires Trusted Publishing to be configured)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --upgrade pip build twine

      - name: Confirm the tag matches the packaged version
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
        run: |
          TAG="${REF#v}"
          PKG=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$TAG packaged=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match version $PKG in pyproject.toml."
            exit 1
          fi

      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    # Runs on a tag push, or on an explicit dispatch with publish_pypi checked.
    # Either way the build job has verified the tag matches pyproject.toml, and
    # a PyPI version can never be reuploaded once published.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/defectdojo-community-mcp

    permissions:
      id-token: write   # OIDC token for Trusted Publishing. No API token is stored.

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.3

  ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=defectdojo-community-mcp
            org.opencontainers.image.description=Read-only MCP server for DefectDojo Community Edition
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          docker run --rm "$IMAGE" --version
          UID_IN_IMAGE=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "container uid: $UID_IN_IMAGE"
          [ "$UID_IN_IMAGE" != "0" ] || { echo "::error::image runs as root"; exit 1; }

  registry:
    name: Publish to MCP Registry
    # Ownership is proven from the published artifacts themselves: the registry
    # reads the mcp-name marker out of the PyPI description and the
    # io.modelcontextprotocol.server.name label off the image. Both must exist
    # before this runs.
    needs: [pypi, ghcr]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # OIDC for `mcp-publisher login github-oidc`. No secret stored.

    env:
      MCP_PUBLISHER_VERSION: v1.8.7

    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"

          # Verify the binary's provenance before running it.
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"

          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --help >/dev/null

      - name: Confirm server.json matches this tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          TAG="${REF#v}"
          JSON=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          echo "tag=$TAG server.json=$JSON"
          if [ "$TAG" != "$JSON" ]; then
            echo "::error::server.json version $JSON does not match tag v$TAG."
            exit 1
          fi

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
