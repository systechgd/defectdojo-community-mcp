name: Release

# Publishes the package to PyPI and the image to GHCR.
#
# Triggered by pushing a v* tag. workflow_dispatch runs the container job only,
# so the image can be (re)published without minting a new version — the PyPI
# job is deliberately tag-only, because a release must correspond to a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref_name:
        description: "Tag to build from (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      publish_pypi:
        description: "Also publish that tag to PyPI (requires Trusted Publishing to be configured)"
        required: false
        default: false
        type: boolean
      publish_registry:
        description: "Also publish server.json to the MCP Registry"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install --upgrade pip build twine

      - name: Confirm the tag matches the packaged version
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
        run: |
          PKG=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          case "$REF" in
            v[0-9]*)
              TAG="${REF#v}"
              echo "tag=$TAG packaged=$PKG"
              if [ "$TAG" != "$PKG" ]; then
                echo "::error::Tag v$TAG does not match version $PKG in pyproject.toml."
                exit 1
              fi
              ;;
            *)
              # A dispatch against a branch (e.g. retrying a registry publish).
              # Nothing is uploaded to PyPI unless publish_pypi is set, and that
              # path always names a tag.
              echo "ref '$REF' is not a version tag; building version $PKG as-is."
              ;;
          esac

      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    # Runs on a tag push, or on an explicit dispatch with publish_pypi checked.
    # Either way the build job has verified the tag matches pyproject.toml, and
    # a PyPI version can never be reuploaded once published.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/defectdojo-community-mcp

    permissions:
      id-token: write   # OIDC token for Trusted Publishing. No API token is stored.

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=defectdojo-community-mcp
            org.opencontainers.image.description=Read-only MCP server for DefectDojo Community Edition
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the published image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          docker run --rm "$IMAGE" --version
          UID_IN_IMAGE=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "container uid: $UID_IN_IMAGE"
          [ "$UID_IN_IMAGE" != "0" ] || { echo "::error::image runs as root"; exit 1; }

  registry:
    name: Publish to MCP Registry
    # Ownership is proven from the published artifacts themselves: the registry
    # reads the mcp-name marker out of the PyPI description and the
    # io.modelcontextprotocol.server.name label off the image. Both must exist
    # before this runs.
    needs: [pypi, ghcr]
    if: >-
      !cancelled() && !failure() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_registry))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # OIDC for `mcp-publisher login github-oidc`. No secret stored.

    env:
      MCP_PUBLISHER_VERSION: v1.8.7

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"

          # Verify the binary's provenance before running it.
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"

          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --help >/dev/null

      - name: Confirm server.json matches this tag
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref_name || github.ref_name }}
        run: |
          JSON=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          case "$REF" in
            v[0-9]*)
              TAG="${REF#v}"
              echo "tag=$TAG server.json=$JSON"
              if [ "$TAG" != "$JSON" ]; then
                echo "::error::server.json version $JSON does not match tag v$TAG."
                exit 1
              fi
              ;;
            *)
              echo "ref '$REF' is not a version tag; publishing server.json version $JSON as-is."
              ;;
          esac

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
