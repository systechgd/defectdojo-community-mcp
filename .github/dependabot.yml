version: 2

updates:

  # Workflow actions are pinned by commit SHA, which is good for supply-chain
  # safety but invisible to a human reading the diff. Dependabot rewrites the
  # SHA and the trailing "# vX" comment together, so pinning stays readable
  # and still gets updated.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      # One PR for the dev toolchain; runtime deps stay separate so they get
      # looked at individually.
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
      - docker
